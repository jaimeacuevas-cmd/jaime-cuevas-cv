name: Deploy CV Interactivo to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias Python
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pipeline ETL
        run: |
          python3 scripts/build.py

      - name: Validar Outputs
        run: |
          python3 -c "
          import json
          import sys
          try:
            # Validate graph_data.json
            with open('dist/data/graph_data.json') as f:
              data = json.load(f)
              assert 'nodes' in data and 'links' in data
              print(f'✓ graph_data.json: {len(data[\"nodes\"])} nodes, {len(data[\"links\"])} links')

            # Validate cartografia.geojson
            with open('dist/data/cartografia.geojson') as f:
              geo = json.load(f)
              assert geo['type'] == 'FeatureCollection'
              print(f'✓ cartografia.geojson: {len(geo[\"features\"])} features')

            # Validate TTL
            with open('dist/data/jaime_knowledge_graph.ttl') as f:
              ttl = f.read()
              assert '@prefix' in ttl
              print(f'✓ jaime_knowledge_graph.ttl: valid Turtle ({len(ttl)} bytes)')

            print('✓ All outputs validated successfully')
          except Exception as e:
            print(f'✗ Validation failed: {e}')
            sys.exit(1)
          "

      - name: Configurar GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Subir Artefacto Web
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/'

      - name: Desplegar a GitHub Pages
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4
