name: Deploy CV Interactivo to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Validate ETL
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias Python
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pipeline ETL
        run: |
          python3 scripts/build.py

      - name: Validar Outputs (JSON/GeoJSON/TTL)
        run: |
          python3 -c "
          import json
          import sys
          try:
            # Validate graph_data.json
            with open('dist/data/graph_data.json') as f:
              data = json.load(f)
              assert 'nodes' in data and 'links' in data
              print(f'✓ graph_data.json: {len(data[\"nodes\"])} nodes, {len(data[\"links\"])} links')

            # Validate cartografia.geojson
            with open('dist/data/cartografia.geojson') as f:
              geo = json.load(f)
              assert geo['type'] == 'FeatureCollection'
              print(f'✓ cartografia.geojson: {len(geo[\"features\"])} features')

            # Validate TTL
            with open('dist/data/jaime_knowledge_graph.ttl') as f:
              ttl = f.read()
              assert '@prefix' in ttl
              print(f'✓ jaime_knowledge_graph.ttl: valid Turtle ({len(ttl)} bytes)')

            print('✓ All outputs validated successfully')
          except Exception as e:
            print(f'✗ Validation failed: {e}')
            sys.exit(1)
          "

      - name: Ejecutar Auditorías Fase 5-7
        run: |
          echo "=== Phase 5: Data Integrity ==="
          python3 scripts/audit_phase5.py | tail -20
          echo ""
          echo "=== Phase 6: Build Reproducibility ==="
          python3 scripts/audit_phase6.py | tail -15
          echo ""
          echo "=== Phase 7: Security & Performance ==="
          python3 scripts/audit_phase7.py | tail -15

      - name: Verificar Reproducibilidad
        run: |
          python3 -c "
          import hashlib
          from pathlib import Path

          files = [
              'dist/data/graph_data.json',
              'dist/data/cartografia.geojson',
              'dist/data/jaime_knowledge_graph.ttl'
          ]

          for f in files:
              p = Path(f)
              if p.exists():
                  content = p.read_text()
                  size = len(content)
                  sha = hashlib.sha256(content.encode()).hexdigest()
                  print(f'✓ {p.name}: {size} bytes | SHA256: {sha[:16]}...')
              else:
                  raise FileNotFoundError(f'{f} not found')
          "

  deploy-to-pages:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias Python
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pipeline ETL
        run: |
          python3 scripts/build.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir Artefacto Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
